<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注音符號故事集</title>
    <style>
        /* 幫整個網頁換上溫柔的米黃色背景，並讓字體居中 */
        body {
            background-color: #FDFBF7;
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }

        /* 讓大標題變得有設計感，帶點可愛的深藍色 */
        h1 {
            color: #3A506B;
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* 這裡把原本醜醜的藍色超連結，變成漂亮的立體按鈕 */
        .story-button {
            display: inline-block;
            background-color: #A3CEF1; /* 溫柔的青藍色 */
            color: #274C77; /* 深藍色文字 */
            text-decoration: none; /* 拿掉底線 */
            font-size: 1.3rem;
            font-weight: bold;
            padding: 15px 40px;
            margin: 15px;
            border-radius: 30px; /* 圓角效果，看起來比較可愛 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* 微妙的陰影，增加立體感 */
            transition: all 0.2s ease; /* 讓滑鼠移過去的動畫變溫柔 */
            min-width: 200px;
        }

        /* 當滑鼠移到按鈕上時，按鈕會微微浮起並變色 */
        .story-button:hover {
            background-color: #6096BA;
            color: #FFFFFF;
            transform: translateY(-3px); /* 往上浮一下 */
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <h1>✨ 我的注音符號故事集 ✨</h1>
    
    <div>
        <a href="p/index.html.html" class="story-button">🎈 ㄆ 的故事</a>
    </div>
    
    <div>
        <a href="m/index.html.html" class="story-button">🐱 ㄇ 的故事</a>
    </div>

</body>
</html>
